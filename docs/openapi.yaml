openapi: 3.0.3

info:
  title: Portal Jobs API
  description: |
    Centralized API documentation for Portal Jobs Microservices.

    Services:
    - User Service
    - Company Service
    - Job Service
    - Application Service
    - Admin Service
  version: 1.0.0

servers:
  - url: http://localhost:8079
    description: API Gateway

tags:
  - name: User - Authentication
    description: Authentication endpoints
  - name: User - Profile
    description: Jobseeker profile endpoints
  - name: User - Skill
    description: Jobseeker skill endpoints
  - name: User - Portfolio
    description: Jobseeker portfolio endpoints
  - name: User - Internal
    description: Internal user-service endpoints

  - name: Company
    description: Company profile endpoints

  - name: Job
    description: Job endpoints

  - name: Application - Jobseeker
    description: Jobseeker application endpoints
  - name: Application - Company
    description: Company application endpoints

  - name: Admin - Report
    description: Admin report endpoints
  - name: Admin - User
    description: Admin user management endpoints

paths:
  # ============================================================
  # USER SERVICE
  # ============================================================

  /register:
    post:
      tags:
        - User - Authentication
      summary: Register user
      description: Register a new jobseeker or company account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
        "400":
          description: Invalid request

  /login:
    post:
      tags:
        - User - Authentication
      summary: Login
      description: Login using email and password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
        "400":
          description: Invalid request
        "401":
          description: Invalid credentials

  /me/profile:
    post:
      tags:
        - User - Profile
      summary: Create jobseeker profile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProfileRequest"
      responses:
        "201":
          description: Profile created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

    get:
      tags:
        - User - Profile
      summary: Get my profile
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Profile not found

    put:
      tags:
        - User - Profile
      summary: Update my profile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Profile not found

  /me/skills:
    post:
      tags:
        - User - Skill
      summary: Create skill
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSkillRequest"
      responses:
        "201":
          description: Skill created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

    get:
      tags:
        - User - Skill
      summary: Get my skills
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Skills retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /me/skills/{id}:
    put:
      tags:
        - User - Skill
      summary: Update skill
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSkillRequest"
      responses:
        "200":
          description: Skill updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Skill not found

    delete:
      tags:
        - User - Skill
      summary: Delete skill
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Skill deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Skill not found

  /me/portfolios:
    post:
      tags:
        - User - Portfolio
      summary: Create portfolio
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePortfolioRequest"
      responses:
        "201":
          description: Portfolio created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

    get:
      tags:
        - User - Portfolio
      summary: Get my portfolios
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Portfolios retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /me/portfolios/{id}:
    get:
      tags:
        - User - Portfolio
      summary: Get portfolio detail
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Portfolio retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Portfolio not found

    put:
      tags:
        - User - Portfolio
      summary: Update portfolio
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePortfolioRequest"
      responses:
        "200":
          description: Portfolio updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Portfolio not found

    delete:
      tags:
        - User - Portfolio
      summary: Delete portfolio
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Portfolio deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Portfolio not found

  /internal/users/{id}/status:
    patch:
      tags:
        - User - Internal
      summary: Update user status
      description: Internal endpoint used to update a user's status.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserStatusRequest"
      responses:
        "200":
          description: User status updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
        "400":
          description: Invalid request
        "404":
          description: User not found

  /internal/users/{user_id}/profile:
    get:
      tags:
        - User - Internal
      summary: Get user profile internally
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "200":
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
        "404":
          description: Profile not found

  /internal/users/{user_id}/skills:
    get:
      tags:
        - User - Internal
      summary: Get user skills internally
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "200":
          description: Skills retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
        "404":
          description: Skills not found

  # ============================================================
  # COMPANY SERVICE
  # ============================================================

  /companies/profile:
    post:
      tags:
        - Company
      summary: Create company profile
      description: |
        Create a company profile for the authenticated company user.
        The user ID is retrieved from the JWT token.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCompanyProfileRequest"
      responses:
        "201":
          description: Company profile created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "409":
          description: Company profile already exists

  /companies/me/profile:
    get:
      tags:
        - Company
      summary: Get my company profile
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Company profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Company profile not found

    put:
      tags:
        - Company
      summary: Update my company profile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCompanyProfileRequest"
      responses:
        "200":
          description: Company profile updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Company profile not found

  # ============================================================
  # JOB SERVICE
  # ============================================================

  /jobs:
    post:
      tags:
        - Job
      summary: Create job
      security:
        - BearerAuth: []
      description: Only users with company role can create a job.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobRequest"
      responses:
        "201":
          description: Job created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

    get:
      tags:
        - Job
      summary: Get all jobs
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Jobs retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
        "401":
          description: Unauthorized

  /jobs/{id}:
    get:
      tags:
        - Job
      summary: Get job detail
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Job retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
        "401":
          description: Unauthorized
        "404":
          description: Job not found

    put:
      tags:
        - Job
      summary: Update job
      security:
        - BearerAuth: []
      description: Only users with company role can update a job.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateJobRequest"
      responses:
        "200":
          description: Job updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Job not found

    delete:
      tags:
        - Job
      summary: Delete job
      security:
        - BearerAuth: []
      description: Only users with company role can delete a job.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Job deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Job not found

  /jobs/{id}/publish:
    patch:
      tags:
        - Job
      summary: Publish job
      security:
        - BearerAuth: []
      description: Only users with company role can publish a job.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Job published successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Job not found

  /jobs/{id}/close:
    patch:
      tags:
        - Job
      summary: Close job
      security:
        - BearerAuth: []
      description: Only users with company role can close a job.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Job closed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Job not found

  /internal/jobs/{id}/required-skills:
    get:
      tags:
        - Job
      summary: Get required skills for a job
      description: Internal endpoint for service-to-service communication.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Required skills retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
        "404":
          description: Job not found

  # ============================================================
  # APPLICATION SERVICE
  # ============================================================

  /applications:
    post:
      tags:
        - Application - Jobseeker
      summary: Apply for a job
      security:
        - BearerAuth: []
      description: Only users with jobseeker role can apply.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApplicationRequest"
      responses:
        "201":
          description: Application created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "409":
          description: Conflict

  /applications/me:
    get:
      tags:
        - Application - Jobseeker
      summary: Get my applications
      security:
        - BearerAuth: []
      description: Only users with jobseeker role can access their applications.
      responses:
        "200":
          description: Applications retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /applications/{id}:
    get:
      tags:
        - Application - Jobseeker
      summary: Get application detail
      security:
        - BearerAuth: []
      description: Only users with jobseeker role can access this endpoint.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Application retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Application not found

    delete:
      tags:
        - Application - Jobseeker
      summary: Delete application
      security:
        - BearerAuth: []
      description: Only users with jobseeker role can delete an application.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Application deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Application not found

  /applications/company/{id}/status:
    patch:
      tags:
        - Application - Company
      summary: Update application status
      security:
        - BearerAuth: []
      description: Only users with company role can update application status.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateApplicationStatusRequest"
      responses:
        "200":
          description: Application status updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Application not found

  /jobs/{job_id}/applications:
    get:
      tags:
        - Application - Company
      summary: Get applications for a job
      security:
        - BearerAuth: []
      description: Only users with company role can access this endpoint.
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "200":
          description: Applications retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Job not found

  # ============================================================
  # ADMIN SERVICE
  # ============================================================

  /admin/reports:
    post:
      tags:
        - Admin - Report
      summary: Create report
      security:
        - BearerAuth: []
      description: Only users with admin role can access this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReportRequest"
      responses:
        "201":
          description: Report created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

    get:
      tags:
        - Admin - Report
      summary: Get all reports
      security:
        - BearerAuth: []
      description: Only users with admin role can access this endpoint.
      responses:
        "200":
          description: Reports retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /admin/reports/{id}:
    get:
      tags:
        - Admin - Report
      summary: Get report detail
      security:
        - BearerAuth: []
      description: Only users with admin role can access this endpoint.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Report retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Report not found

  /admin/reports/{id}/status:
    patch:
      tags:
        - Admin - Report
      summary: Update report status
      security:
        - BearerAuth: []
      description: Only users with admin role can access this endpoint.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReportStatusRequest"
      responses:
        "200":
          description: Report status updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Report not found

  /admin/users/{id}/status:
    patch:
      tags:
        - Admin - User
      summary: Update user status
      security:
        - BearerAuth: []
      description: Only users with admin role can access this endpoint.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserStatusRequest"
      responses:
        "200":
          description: User status updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: User not found

components:
  # ============================================================
  # SECURITY
  # ============================================================

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  # ============================================================
  # PARAMETERS
  # ============================================================

  parameters:
    ID:
      name: id
      in: path
      required: true
      description: Resource ID
      schema:
        type: integer
        format: uint

    UserID:
      name: user_id
      in: path
      required: true
      description: User ID
      schema:
        type: integer
        format: uint

    JobID:
      name: job_id
      in: path
      required: true
      description: Job ID
      schema:
        type: integer
        format: uint

  # ============================================================
  # SCHEMAS
  # ============================================================

  schemas:
    # ----------------------------------------------------------
    # COMMON RESPONSE
    # ----------------------------------------------------------

    StandardResponse:
      type: object
      properties:
        responseCode:
          type: string
        responseMessage:
          type: string
        responseData:
          nullable: true

    # ----------------------------------------------------------
    # USER SERVICE
    # ----------------------------------------------------------

    RegisterRequest:
      type: object
      required:
        - nama
        - email
        - password
        - role
      properties:
        nama:
          type: string
          minLength: 3
          maxLength: 100
          example: John Doe

        email:
          type: string
          format: email
          example: john@example.com

        password:
          type: string
          minLength: 8
          format: password
          example: password123

        role:
          type: string
          enum:
            - jobseeker
            - company
          example: jobseeker

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: john@example.com

        password:
          type: string
          format: password
          example: password123

    UpdateUserStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - active
            - suspended
          example: active

    CreateProfileRequest:
      type: object
      required:
        - name
        - phoneNumber
        - address
        - educationLevel
        - started
        - graduated
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100

        phoneNumber:
          type: string

        address:
          type: string

        faculty:
          type: string

        major:
          type: string

        educationLevel:
          type: string

        started:
          type: integer
          minimum: 1900

        graduated:
          type: integer
          minimum: 1900

        cvUrl:
          type: string

        portfolioUrl:
          type: string

    UpdateProfileRequest:
      type: object
      required:
        - name
        - phoneNumber
        - address
        - educationLevel
        - started
        - graduated
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100

