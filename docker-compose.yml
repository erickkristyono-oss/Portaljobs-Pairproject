services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: portaljob
      POSTGRES_PASSWORD: portaljob_secret
      POSTGRES_DB: portaljob
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portaljob"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: portaljob
      DB_PASSWORD: portaljob_secret
      DB_NAME: portaljob
      DB_SSLMODE: disable
      JWT_SECRET: super-secret-change-me
      JWT_EXPIRE_HOURS: "24"
    ports:
      - "8080:8080"

volumes:
  pgdata:
